aid: cookieyes
name: Cookieyes
description: >-
  CookieYes is a Google-certified consent management platform (CMP) that helps
  websites comply with privacy laws such as GDPR, CCPA/CPRA, LGPD, PIPEDA and
  POPIA. It provides customizable cookie consent banners, an automatic cookie
  scanner with AI-based classification, geo-targeted banner display, consent
  logging and export, multilingual support, Google Consent Mode v2 and IAB TCF
  v2.2 compliance, and policy generators. CookieYes ships apps and plugins for
  WordPress, Shopify, Wix, Webflow and any HTML site, plus a client-side
  JavaScript consent API (getCkyConsent, performBannerAction). CookieYes runs an
  OAuth 2.0 / OpenID Connect authorization server and a hosted, OAuth-gated Model
  Context Protocol (MCP) server for agent access. Part of Mozilor Technologies,
  it is used by over 1.5 million websites.
